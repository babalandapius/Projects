<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX LESSONS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #user-info {
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 400px;
    }
    #fetch-btn {
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }
    #fetch-btn:hover {
      background-color: #0056b3;
    }
    #user-name, #user-email {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>AJAX Lessons</h1>
  <div id="user-info">
    <h2>User Information</h2>
    <p id="user-name">Loading name... </p>
    <p id="user-email">Loading email... </p>
    <button id="fetch-btn">Fetch User Info</button>
  </div>
  <script>
    const nameElement = document.getElementById('user-name');
    const emailElemnt = document.getElementById('user-email');
    const button = document.getElementById('fetch-btn');

    // Using the old XMLHttpRequest method to fetch user data
    /*
    function getUser() {
      const userId = Math.floor(Math.random() * 10) + 1; // Random user ID between 1 and 10

      fetch(`https://jsonplaceholder.typicode.com/users/${userId}`)
      .then(response => response.json())
      .then(user => {
        nameElement.textContent = `Name: ${user.name}`;
        emailElemnt.textContent = `Email: ${user.email}`;
      })
      .catch(err => console.error("Fetch failed: ", err));
    }

    button.addEventListener('click', getUser);
    */






    //Using the modern async/await syntax to fetch user data

    async function getUser() {
      try {
        const userId = Math.floor(Math.random() * 10) + 1; // Random user ID between 1 and 10
        const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);
        const user = await response.json();

        nameElement.textContent = `Name: ${user.name}`;
        emailElemnt.textContent = `Email: ${user.email}`;

      } catch (error) {
        console.error("Fetch failed: ", error);
      }
    }
    button.addEventListener('click', getUser);

  </script>
</body>
</html>
